
name: Publish Stories

on:
  push:
    branches:
      - main
    paths:
      - "New Stories/**"
      - "Published Stories/**"
      - "scripts/librarian.py"
      - ".github/workflows/publish-stories.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Publish stories
        run: python scripts/librarian.py

      - name: Save published stories, backups and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "Published Stories" "Saves" catalog.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish stories and save backups"
            git push
          fi
